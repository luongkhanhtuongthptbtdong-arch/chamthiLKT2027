# Tự động tạo 3 bản cài đặt Chấm Trắc Nghiệm LKT: Android (.apk), Windows (.exe), iOS (.ipa chưa ký)
# và đăng bản web/PWA lên GitHub Pages (cài trên iPhone/iPad bằng Safari → Thêm vào MH chính).
name: Build Cham Trac Nghiem LKT
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Cài Capacitor
        working-directory: mobile
        run: npm ci || npm install
      - name: Chép bản web vào app
        run: |
          cp web/index.html mobile/www/index.html
          cp web/icon-*.png mobile/www/
          cd mobile && npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Đổi tên APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk ChamTracNghiemLKT-Android-2.1.0.apk
      - uses: actions/upload-artifact@v4
        with: { name: ChamTracNghiemLKT-Android, path: ChamTracNghiemLKT-Android-2.1.0.apk }

  windows:
    name: Windows Setup + Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Chép bản web
        shell: bash
        run: |
          mkdir -p desktop/app
          cp web/index.html web/icon-*.png desktop/app/
      - name: Build bộ cài
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with: { name: ChamTracNghiemLKT-Windows, path: desktop/dist/*.exe }

  ios:
    name: iOS (IPA chưa ký – cài bằng Sideloadly/AltStore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Tạo dự án iOS
        working-directory: mobile
        run: |
          npm ci || npm install
          cp ../web/index.html www/index.html
          cp ../web/icon-*.png www/
          [ -d ios ] || npx cap add ios --packagemanager SPM
          npx cap sync ios
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Chụp phiếu trả lời để chấm điểm'" $PL || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Chọn ảnh phiếu trả lời để chấm điểm'" $PL || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Chấm TN LKT'" $PL || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 2.1.0" $PL || true
      - name: Biểu tượng app
        working-directory: mobile
        run: |
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset
          sips -z 1024 1024 www/icon-1024.png --out $ICON/AppIcon-512@2x.png || true
      - name: Build (không ký)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../../ChamTracNghiemLKT-iOS-2.1.0-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ChamTracNghiemLKT-iOS, path: ChamTracNghiemLKT-iOS-2.1.0-unsigned.ipa }

  pages:
    name: Web / PWA (iPhone, iPad, mọi máy)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Phát hành
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: Chấm Trắc Nghiệm LKT ${{ github.ref_name }}
          body: |
            - Windows: ChamTracNghiemLKT-Setup-*.exe (cài đặt) hoặc *-Portable-*.exe (chạy ngay)
            - Android: ChamTracNghiemLKT-Android-*.apk
            - iOS: dùng bản web (GitHub Pages) → Safari → Thêm vào MH chính; hoặc cài .ipa bằng Sideloadly
